name: Poker Arena
on:
  push:
    branches: [poker-arena-mvp]
  pull_request:
    branches: [main]
    paths:
      - 'poker/**'
      - '.github/workflows/poker.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poker/server/package.json
      - name: Instalar dependências
        working-directory: poker/server
        run: npm install
      - name: Testar servidor e motor de poker
        working-directory: poker/server
        run: npm test
